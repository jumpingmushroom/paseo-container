# Debian includes /etc/ssh/sshd_config.d/*.conf at the top of sshd_config, and
# sshd honours the first occurrence of each keyword, so this file wins.
#
# Subsystem is deliberately absent: Debian's sshd_config already defines sftp,
# and a second definition is a fatal configuration error.

Port 22
AddressFamily any
ListenAddress 0.0.0.0
ListenAddress ::

PermitRootLogin no
AllowUsers paseo

PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
UsePAM yes

X11Forwarding no
PrintMotd no
AcceptEnv LANG LC_*
ClientAliveInterval 60
ClientAliveCountMax 5

# Non-interactive `ssh host <command>` does not read /etc/profile, so anything
# /etc/profile.d/paseo-container.sh sets up for a login shell has to be
# repeated here: the agents and tools under /config, and the uv variables that
# keep an `ssh host uvx ...` writing into /config rather than into a home
# directory that a recreate throws away. Keep the two in sync.
#
# sshd honours only the first occurrence of a keyword, so every pair belongs on
# this one line.
SetEnv PATH=/config/tools/bin:/config/agents/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin UV_TOOL_DIR=/config/tools/uv/tools UV_TOOL_BIN_DIR=/config/tools/bin UV_PYTHON_INSTALL_DIR=/config/tools/uv/python UV_PYTHON_PREFERENCE=only-managed UV_CACHE_DIR=/config/tools/uv/cache
